<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Borneo Indonesian Restaurant — order direct, pay zero commission. Powered by EatLocal OS." />
    <title>Borneo Indonesian Restaurant · Order Direct — EatLocal OS</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23f97316'/%3E%3Cpath d='M20 8c.6 3.8-4.8 6.2-4.8 11.2 0 2.6 1.5 4.4 3.2 5.2-.5-3.4 2.4-4.6 2.2-7.6 2.9 1.6 5.6 4.5 5.6 8.4 0 1.5-.4 2.9-1.1 4 2.7-1.2 5.9-4 5.9-8.6C31 14 22.7 12.5 20 8Z' fill='%23fff'/%3E%3Cpath d='M13 30.5h14' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- Fonts load async so they can never block first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" /></noscript>
    <style>
      html, body { margin: 0; padding: 0; background: #faf8f5; }
      html.dark, html.dark body { background: #0c0a09; }
      #root:empty::before { content: ""; }
      .boot {
        min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #faf8f5; font-family: system-ui, sans-serif;
      }
      html.dark .boot { background: #0c0a09; }
      .boot b { font-family: Georgia, "Times New Roman", serif; font-size: 26px; color: #1c1917; letter-spacing: -0.01em; }
      html.dark .boot b { color: #faf8f5; }
      .boot small { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #a8a29e; }
      .boot .dots { display: flex; gap: 7px; }
      .boot .dots i {
        width: 9px; height: 9px; border-radius: 999px; background: linear-gradient(135deg, #f97316, #ea580c);
        animation: bootdot 1.1s ease-in-out infinite;
      }
      .boot .dots i:nth-child(2) { animation-delay: 0.15s; }
      .boot .dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bootdot { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-7px); opacity: 0.5; } }
    </style>
    <script>
      // Apply saved theme before first paint to avoid flash
      (function () {
        try {
          var t = localStorage.getItem("borneo-theme") || "light";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script>
      // Boot watchdog: if React never mounts, surface the actual reason
      // instead of leaving the diner staring at the splash screen.
      window.__bootErrors = [];
      window.addEventListener("error", function (e) {
        window.__bootErrors.push((e.message || "unknown error") + (e.filename ? " @ " + e.filename + ":" + e.lineno : ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__bootErrors.push("Promise: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
      setTimeout(function () {
        var status = document.getElementById("boot-status");
        if (!status) return; // React mounted and replaced the splash — all good
        var dots = document.querySelector(".boot .dots");
        if (dots) dots.style.display = "none";
        var msg = window.__bootErrors.length
          ? window.__bootErrors[0]
          : "The app bundle didn't arrive. Check your connection or the browser console, then reload.";
        status.textContent = msg;
        status.style.maxWidth = "420px";
        status.style.lineHeight = "1.6";
        status.style.textTransform = "none";
        status.style.letterSpacing = "normal";
        status.style.color = "#f97316";
        var retry = document.getElementById("boot-retry");
        if (retry) retry.style.display = "inline-block";
      }, 7000);
    </script>
  </head>
  <body>
    <div id="root">
      <!-- First paint: replaced the moment React mounts -->
      <div class="boot">
        <b>Borneo</b>
        <div class="dots"><i></i><i></i><i></i></div>
        <small id="boot-status">Firing up the kitchen</small>
        <button
          id="boot-retry"
          style="display:none;margin-top:6px;padding:11px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:system-ui,sans-serif"
          onclick="location.reload()"
        >
          Reload
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
